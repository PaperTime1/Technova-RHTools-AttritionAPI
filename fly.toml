# fly.toml app configuration file generated for technova-attrition-api on 2026-03-21T17:46:49+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'technova-attrition-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

# Initialisation de la base à chaque déploiement, AVANT la mise en service de la nouvelle
# version : création des tables (idempotente) puis insertion du dataset si la table est vide.
# Si la commande échoue, le déploiement est annulé.
[deploy]
  release_command = "sh -c 'python scripts/create_db.py && python scripts/insert_dataset.py'"

[env]
  API_HOST = '0.0.0.0'
  API_PORT = '8000'
  ENVIRONMENT = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
