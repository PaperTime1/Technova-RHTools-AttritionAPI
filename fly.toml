# Configuration Fly.io — TechNova Attrition API
app = "technova-attrition-api"
primary_region = "cdg"  # Paris

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  API_HOST = "0.0.0.0"
  API_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
