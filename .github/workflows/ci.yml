name: CI/CD Pipeline

# CI : lint + tests à chaque push et à chaque pull request (validation avant fusion).
# CD : develop → environnement « staging » ; tag vX.Y.Z → environnement « production ».
on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

# Un seul pipeline actif par branche : une nouvelle poussée annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Apps Fly : production = celle de fly.toml ; staging = app séparée (même image, autre base)
  FLY_APP: technova-attrition-api
  FLY_APP_STAGING: technova-attrition-api-staging

jobs:
  # ── 1. Qualité du code (échec rapide) ──
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uvx ruff check app/ tests/ scripts/

  # ── 2. Tests sur un vrai PostgreSQL (même SGBD qu'en production) ──
  test:
    name: Tests (Pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    environment: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_technova
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENVIRONMENT: test
      # Base éphémère du runner : identifiants jetables, pas un secret
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_technova
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_technova

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: Run tests (coverage lignes + branches, seuil 85 %)
        run: >-
          pytest --cov=app --cov-branch
          --cov-report=xml --cov-report=html --cov-report=term-missing
          --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ── 3. Build de l'image (vérifie que le Dockerfile construit) ──
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t technova-attrition-api:${{ github.sha }} .

  # ── 4a. Déploiement staging (branche develop) ──
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://${{ env.FLY_APP_STAGING }}.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --app "${{ env.FLY_APP_STAGING }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 10 "https://${{ env.FLY_APP_STAGING }}.fly.dev/health"

  # ── 4b. Déploiement production (tag de version vX.Y.Z) ──
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production  # règles de protection : approbation manuelle possible
      url: https://${{ env.FLY_APP }}.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 10 "https://${{ env.FLY_APP }}.fly.dev/health"
